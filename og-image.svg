<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- 装饰圆 -->
  <circle cx="1000" cy="100" r="300" fill="white" opacity="0.05"/>
  <circle cx="200" cy="530" r="200" fill="white" opacity="0.04"/>
  <!-- Logo -->
  <rect x="100" y="180" width="120" height="120" rx="30" fill="white" opacity="0.15"/>
  <text x="160" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="bold" fill="white">CM</text>
  <!-- 主标题 -->
  <text x="100" y="440" font-family="system-ui, sans-serif" font-size="64" font-weight="bold" fill="white">婵梦科技</text>
  <text x="100" y="490" font-family="system-ui, sans-serif" font-size="28" fill="rgba(255,255,255,0.75)">中国企业终身增长合伙人</text>
  <!-- 副标题 -->
  <text x="380" y="500" font-family="system-ui, sans-serif" font-size="20" fill="rgba(255,255,255,0.5)">AI + 流量 + 人才 + 产业 · 四维驱动增长</text>
</svg>
